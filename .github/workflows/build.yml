name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APK_DIR: ujicoba          # folder hasil ekstrak APK di repo
  APK_NAME: ujicoba
  BUILD_TOOLS: 34.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build-tools (zipalign + apksigner)
        run: |
          sdkmanager --install "build-tools;${BUILD_TOOLS}" >/dev/null
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Pack folder menjadi APK
        run: |
          mkdir -p out
          ROOT="$PWD"
          cd "$APK_DIR"
          # resources.arsc & native libs harus STORED (tanpa kompresi)
          zip -X -0 -r "$ROOT/out/unsigned.zip" resources.arsc lib
          # sisanya dikompres, tanpa signature lama
          zip -X -r "$ROOT/out/unsigned.zip" . \
            -x resources.arsc 'lib/*' \
               META-INF/CERT.RSA META-INF/CERT.SF META-INF/MANIFEST.MF
          mv "$ROOT/out/unsigned.zip" "$ROOT/out/unsigned.apk"

      - name: Zipalign
        run: zipalign -p -f 4 out/unsigned.apk out/aligned.apk

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Secrets tidak ada, pakai debug keystore sementara"
            keytool -genkeypair -v -keystore release.jks -storepass android \
              -keypass android -alias debugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Debug,O=Android,C=US"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=debugkey" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.jks \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "out/${APK_NAME}.apk" out/aligned.apk
          apksigner verify --verbose "out/${APK_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: out/${{ env.APK_NAME }}.apk
          if-no-files-found: error
